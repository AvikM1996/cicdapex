name: Deploy APEX App

on:
  push:
    branches:
      - cicd

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 📦 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y unzip curl

      - name: 🔐 Decode Wallet
        run: |
          echo "${{ secrets.DB_WALLET }}" | base64 -d > wallet.zip
          unzip -o wallet.zip -d wallet

      - name: 📍 Set TNS_ADMIN
        run: echo "TNS_ADMIN=$(pwd)/wallet" >> $GITHUB_ENV

      - name: ⚙️ Install SQLcl
        run: |
          curl -L -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -o sqlcl.zip

      - name: Install Liquibase
        run: |
          curl -L -o liquibase.tar.gz https://github.com/liquibase/liquibase/releases/download/v4.23.0/liquibase-4.23.0.tar.gz
          mkdir liquibase-cli
          tar -xzf liquibase.tar.gz -C liquibase-cli
          
          # 🔐 Copy Oracle security jars from SQLcl to Liquibase
          cp sqlcl/lib/oraclepki.jar liquibase-cli/internal/lib/ || echo "⚠️ oraclepki.jar not found"
          cp sqlcl/lib/osdt_core.jar liquibase-cli/internal/lib/ || echo "⚠️ osdt_core.jar not found"
          cp sqlcl/lib/osdt_cert.jar liquibase-cli/internal/lib/ || echo "⚠️ osdt_cert.jar not found"

          chmod +x liquibase-cli/liquibase
          echo "$(pwd)/liquibase-cli" >> $GITHUB_PATH

      # 🚀 Run Liquibase
      - name: Run Liquibase Migration
        run: |
          liquibase \
            --url="${{ secrets.DB_URL }}" \
            --username="${{ secrets.DB_USER }}" \
            --password="${{ secrets.DB_PASS }}" \
            --changeLogFile="./liquibase/master.xml" \
            --searchPath="./liquibase" \
            --driver=oracle.jdbc.OracleDriver \
            --liquibaseSchemaName=IRM_POC \
            --defaultSchemaName=IRM_POC \
            update

      - name: 🔍 Debug Environment
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== ROOT FILES ====="
          ls -l
          echo "===== WALLET FILES ====="
          ls -l wallet
          echo "===== APEX EXPORT FILES ====="
          ls -l f119 || echo "❌ f119 folder not found"
          echo "===== CHECK install.sql ====="
          cat f119/install.sql | head -n 20 || echo "❌ install.sql missing"
      - name: Connect to DB
        run: |
          ./sqlcl/bin/sql -s /nolog <<EOF
          CONNECT ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }}
          SET HEADING OFF;
          SELECT 'DB Connected: ' || SYSDATE FROM dual;
          EXIT;
          EOF

      - name: 🔍 Diagnostic Queries
        run: |
          ./sqlcl/bin/sql -s ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }} <<EOF
          SET DEFINE OFF;
          SET SCAN OFF;
          SET HEADING ON;
          SET FEEDBACK OFF;
          PROMPT ===== SCHEMA & TABLE INFO =====;
          SELECT sys_context('USERENV', 'CURRENT_SCHEMA') AS current_schema FROM dual;
          SELECT owner, table_name FROM all_tables WHERE table_name = 'PRODUCT' OR table_name = 'product';
          
          PROMPT ===== APEX WORKSPACE MAPPING =====;
          -- In apex_workspace_schemas, the column is workspace_name
          SELECT workspace_name, schema FROM apex_workspace_schemas WHERE schema = 'IRM_POC';
          
          PROMPT ===== FINAL WORKSPACE CHECK =====;
          -- In apex_applications, the column is workspace
          SELECT workspace, application_id, application_name FROM apex_applications WHERE application_id = 119;
          exit;
          EOF

      - name: 🔌 Test DB Connection
        run: |
          ./sqlcl/bin/sql -s ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }} <<EOF
          SET DEFINE OFF;
          SET SCAN OFF;
          SET HEADING OFF;
          SELECT 'DB Connected: ' || SYSDATE FROM dual;
          exit;
          EOF

      - name: 📊 Check Existing Apps
        run: |
          ./sqlcl/bin/sql -s ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }} <<EOF
          SET DEFINE OFF;
          SET SCAN OFF;
          SET HEADING OFF;
          SELECT workspace || ' | ' || application_id || ' | ' || application_name 
          FROM apex_applications 
          WHERE application_id = 119;
          exit;
          EOF
      - name: 🔍 Find Workspace from Schema  
        run: |
          ./sqlcl/bin/sql -s ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }} <<EOF
          SET DEFINE OFF;
          SET SCAN OFF;
          SET HEADING ON;
          SELECT workspace_name, schema 
          FROM apex_workspace_schemas;
          exit;
          EOF

      - name: 🚀 Import APEX Application
        run: |
          ./sqlcl/bin/sql ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }} <<EOF
          SET DEFINE OFF;
          SET SCAN OFF;
          WHENEVER SQLERROR EXIT SQL.SQLCODE;
          BEGIN
            -- 🛠️ Force import into wksp_poc workspace and IRM_POC schema
            apex_application_install.set_workspace('${{ secrets.APEX_WORKSPACE }}');
            apex_application_install.set_schema('IRM_POC');
          END;
          /
          PROMPT ===== STARTING APEX IMPORT =====;
          @f119/install.sql
          PROMPT ===== IMPORT COMPLETED =====;
          exit;
          EOF
      - name: 🔍 Check Workspace Mapping  
        run: |
          ./sqlcl/bin/sql -s ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }} <<EOF
          SET HEADING ON;
          SELECT workspace, application_id, application_name 
          FROM apex_applications 
          WHERE application_id = 119;
          exit;
          EOF

      - name: ✅ Verify Deployment
        run: |
          ./sqlcl/bin/sql -s ${{ secrets.DB_USER }}/${{ secrets.DB_PASS }}@${{ secrets.DB_CONN }} <<EOF
          SET HEADING OFF;
          SELECT 'AFTER DEPLOY: ' || application_id || ' - ' || application_name 
          FROM apex_applications 
          WHERE application_id = 119;
          exit;
          EOF

